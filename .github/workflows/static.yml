# Builds the frontend as a fully static site and publishes it to Cloudflare Pages.
#
# Same branch, same source as the CMS image — the two differ only in how they
# are built. NEXT_PUBLIC_BUILD_TARGET=static switches next.config.js to
# `output: export` and aliases src/data to the REST client, so this build reads
# everything from the remote Payload API and needs no database.
#
# Payload's admin UI and the server-only route handlers cannot be statically
# exported, so they are removed before building — see "Strip server-only
# routes". They stay in the repo; only this checkout loses them.
#
# Required repository configuration:
#   secrets.CLOUDFLARE_API_TOKEN     - token with "Cloudflare Pages: Edit"
#   secrets.CLOUDFLARE_ACCOUNT_ID    - Cloudflare account id
#   vars.CLOUDFLARE_PAGES_PROJECT    - the Pages project name
#   vars.CLOUDFLARE_PAGES_BRANCH     - optional; the Pages branch to deploy to
#                                      (default: static, the production one)
#   vars.NEXT_PUBLIC_PAYLOAD_API_URL - Payload REST API base, incl. /api
#   vars.NEXT_PUBLIC_SERVER_URL      - public URL of this static site
name: Static site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Next has no way to exclude app routes via config, so anything that
      # cannot be prerendered is deleted from the checkout before building:
      #   (payload)            - admin UI + REST/GraphQL handlers
      #   (frontend)/next      - preview, exit-preview and seed handlers
      #   (frontend)/(sitemaps)- dynamic getServerSideSitemap handlers
      #
      # The data client is swapped the same way, by copying a file rather than
      # by a bundler alias: next.config.js's `webpack` hook is ignored under
      # Turbopack, so an alias there left @/data pointing at the Local API and
      # the export went looking for a database.
      - name: Strip server-only routes and switch to the REST data client
        run: |
          rm -rf "src/app/(payload)"
          rm -rf "src/app/(frontend)/next"
          rm -rf "src/app/(frontend)/(sitemaps)"
          cp src/data/index.static.ts src/data/index.ts
          grep -q "from './remote'" src/data/index.ts

          # `output: export` rejects force-dynamic, and route segment config
          # has to be a literal, so there is no flag that turns it off — the
          # line goes. The greps are the point: a sed that quietly matches
          # nothing would hand the export a dynamic layout and fail it later
          # with something unrelated-looking.
          layout="src/app/(frontend)/layout.tsx"
          grep -q "^export const dynamic = 'force-dynamic'$" "$layout"
          sed -i "/^export const dynamic = 'force-dynamic'$/d" "$layout"
          ! grep -q "export const dynamic" "$layout"

      # `npx next build` rather than `npm run build`: the latter triggers the
      # postbuild next-sitemap hook, which is configured for the server build.
      - name: Build static export
        run: npx next build
        env:
          NEXT_PUBLIC_BUILD_TARGET: static
          NEXT_PUBLIC_PAYLOAD_API_URL: ${{ vars.NEXT_PUBLIC_PAYLOAD_API_URL }}
          NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}

      # A build against an empty or unreachable API would otherwise publish a
      # near-empty site without failing.
      - name: Verify export
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/404.html   || { echo "::error::out/404.html missing"; exit 1; }
          pages=$(find out -name '*.html' | wc -l)
          echo "exported $pages HTML pages"
          if [ "$pages" -lt 3 ]; then
            echo "::error::only $pages pages exported — the API is probably unreachable"
            exit 1
          fi

      - name: Upload export as artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out/
          retention-days: 7

      # --branch is the Pages branch, not the git branch, and Cloudflare treats
      # whichever one the project calls production differently from the rest.
      # It stayed `static` when the source moved to main, so production keeps
      # landing where it always did; set vars.CLOUDFLARE_PAGES_BRANCH to move it.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy out
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ vars.CLOUDFLARE_PAGES_BRANCH || 'static' }}
